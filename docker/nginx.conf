server {
    listen 80;
    server_name www.frederikberg.com;
    return 301 https://frederikberg.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    charset_types text/plain application/json;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Paths of the previous version of the site.
    location = /uploads/cv.pdf { return 301 /cv.pdf; }
    location = /blog/footprints-and-handprints/footprints-and-handprints.pdf { return 301 /blog/footprints-and-handprints/; }
    location = /blog/complete-food-and-home-cooking/complete-food-and-home-cooking.pdf { return 301 /blog/complete-food-and-home-cooking/; }
    location ^~ /publication/ { return 301 /publications/; }
    location ^~ /news/ { return 301 /blog/; }
    location ^~ /project/ { return 301 /projects/; }
    location ^~ /uploads/ { return 301 /#accomplishments; }

    # Fingerprinted build output never changes under the same name.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.bib$ {
        default_type "text/plain; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
