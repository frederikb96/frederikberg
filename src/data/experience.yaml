# Positions, newest first. One file feeds two renderings:
#   - the Experience section of the website: `title`, `organization`, `location`, dates, `bullets`;
#     an entry with `site: false` is left out there.
#   - the one-page CV: the `cv` block. `show: false` leaves the entry out; `title`,
#     `organization` and `location` override the site values when set; `bullets` are the CV's
#     shorter text, with Markdown-style [text](url) links.
# Dates are YYYY-MM; `end: null` means "present".

