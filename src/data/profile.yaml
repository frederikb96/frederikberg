bio:
  - >-
    I work as a Security Analytics Consultant at SVA, where I build and run SOC and SIEM platforms
    on the Elastic Stack: infrastructure and detection rules as code, automated operations, and the
    reporting around them. Before that I did research at the Chair for Embedded Software at RWTH
    Aachen on the functional safety of interconnected medical devices, with three publications and
    a lecture on microcontroller programming.
  - >-
    Outside work I run a small Kubernetes homelab on Hetzner that hosts services for family and
    friends, watched by an Elastic SIEM and operated by AI agents that I build as part of my
    personal AI infrastructure. I co-organise the Effective Altruism group in Aachen, and I spend
    the rest of my time bouldering, cycling and hiking.
